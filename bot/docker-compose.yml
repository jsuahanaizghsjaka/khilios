services:
  bot:
    build: .
    container_name: khilios-bot
    restart: unless-stopped
    env_file: ../infra/bot/bot.env
    volumes:
      - bot-data:/data
      # Состояние узлов для рассылки об авариях. Только чтение: файл
      # генерирует status-json.sh на хосте, бот его лишь читает — и не
      # должен иметь возможности испортить то, что видит сайт.
      # Каталог, а не сам файл: docker подменяет одиночный файл inode-ом
      # на момент старта, и после первой же перезаписи cron-ом контейнер
      # продолжил бы читать старую версию, ничего не заметив.
      - /var/www/status:/var/www/status:ro
    # Бот стоит на панельной машине и ходит к API панели по localhost.
    # network_mode: host — самый простой способ дотянуться до 127.0.0.1:3000
    # хоста, не открывая API панели наружу вообще.
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  bot-data:
